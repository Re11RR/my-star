<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>to my only star</title>
    <style>
        :root {
            color-scheme: dark;
            background: #000;
            font-family: Georgia, "Times New Roman", serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #05070d;
        }

        body {
            position: relative;
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            isolation: isolate;
        }

        /* Keep the chosen image fixed beneath every moment of the experience. */
        body::before,
        body::after {
            position: fixed;
            inset: 0;
            content: "";
            pointer-events: none;
        }

        body::before {
            z-index: -2;
            background: url("stars-bg.jpg") center / cover no-repeat;
        }

        body::after {
            z-index: -1;
            background: rgba(3, 5, 12, .43);
        }

        #sky {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            display: block;
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background: rgba(255, 255, 255, var(--brightness));
            box-shadow: 0 0 var(--glow) rgba(220, 235, 255, var(--brightness));
            opacity: 0;
            animation:
                appear 900ms ease-out var(--delay) forwards,
                twinkle var(--twinkle-duration) ease-in-out var(--delay) infinite alternate,
                drift var(--drift-duration) ease-in-out var(--delay) infinite alternate;
        }

        .star.large {
            background: #fff;
            box-shadow:
                0 0 5px 1px rgba(255, 255, 255, .85),
                0 0 14px 3px rgba(205, 225, 255, .38);
        }

        .star.bright {
            z-index: 1;
            background: #fff;
            box-shadow:
                0 0 6px 2px rgba(255, 255, 255, .95),
                0 0 18px 5px rgba(218, 232, 255, .55),
                0 0 32px 8px rgba(190, 213, 255, .2);
            animation:
                appear 1.2s ease-out var(--delay) forwards,
                twinkle var(--twinkle-duration) ease-in-out var(--delay) infinite alternate,
                drift var(--drift-duration) ease-in-out var(--delay) infinite alternate,
                pulse 4.5s ease-in-out var(--delay) infinite alternate;
        }

        .star.bright::before,
        .star.bright::after {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1px;
            height: 12px;
            border-radius: 100%;
            background: linear-gradient(transparent, rgba(255, 255, 255, .72), transparent);
            content: "";
            transform: translate(-50%, -50%);
        }

        .star.bright::after {
            width: 12px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .72), transparent);
        }

        .shooting-star {
            position: absolute;
            width: var(--length);
            height: 2px;
            border-radius: 999px;
            opacity: 0;
            background: linear-gradient(90deg, transparent, rgba(220, 235, 255, .65), #fff);
            filter: drop-shadow(0 0 4px rgba(220, 235, 255, .85));
            transform: rotate(var(--angle));
            transform-origin: right center;
            animation: shoot var(--speed) ease-out forwards;
        }

        .shooting-star::after {
            position: absolute;
            top: 50%;
            right: 0;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 8px 2px rgba(235, 245, 255, .9);
            content: "";
            transform: translateY(-50%);
        }

        #question-box {
            position: fixed;
            z-index: 2;
            top: 50%;
            left: 50%;
            width: min(430px, calc(100% - 36px));
            padding: 42px 38px 38px;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 18px;
            background: rgba(5, 7, 12, .56);
            box-shadow: 0 18px 70px rgba(0, 0, 0, .28), 0 0 34px rgba(205, 221, 255, .07), inset 0 1px rgba(255, 255, 255, .08);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            text-align: center;
            transform: translate(-50%, -50%);
            transition: opacity 850ms ease, transform 850ms cubic-bezier(.2, .7, .2, 1), filter 850ms ease;
        }

        #question-box h1 {
            margin: 0 0 28px;
            color: rgba(255, 255, 255, .96);
            font-size: clamp(28px, 5vw, 38px);
            font-weight: 400;
            line-height: 1.2;
            text-shadow: 0 0 24px rgba(255, 255, 255, .14);
        }

        .answers {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .answer-button {
            min-width: 124px;
            min-height: 46px;
            padding: 11px 20px;
            border: 1px solid rgba(255, 255, 255, .42);
            border-radius: 999px;
            color: rgba(255, 255, 255, .94);
            background: rgba(255, 255, 255, .055);
            box-shadow: 0 0 18px rgba(255, 255, 255, .1), inset 0 0 12px rgba(255, 255, 255, .025);
            font: 16px Georgia, "Times New Roman", serif;
            cursor: pointer;
            transition: transform 260ms ease, background 260ms ease, box-shadow 260ms ease, border-color 260ms ease;
            -webkit-tap-highlight-color: transparent;
        }

        .answer-button:hover,
        .answer-button:focus-visible {
            border-color: rgba(255, 255, 255, .75);
            background: rgba(255, 255, 255, .12);
            box-shadow: 0 0 26px rgba(255, 255, 255, .2), inset 0 0 14px rgba(255, 255, 255, .05);
            outline: none;
            transform: translateY(-3px) scale(1.025);
        }

        .answer-button:active {
            transform: translateY(-1px) scale(.99);
        }

        #question-box.leaving {
            opacity: 0;
            filter: blur(4px);
            pointer-events: none;
            transform: translate(-50%, -50%) scale(.94);
        }

        #message {
            position: fixed;
            z-index: 2;
            top: 50%;
            left: 50%;
            width: min(900px, calc(100% - 42px));
            margin: 0;
            color: rgba(255, 255, 255, .94);
            font-size: clamp(23px, 4.2vw, 42px);
            font-weight: 400;
            line-height: 1.45;
            text-align: center;
            text-shadow: 0 0 18px rgba(255, 255, 255, .18);
            opacity: 0;
            transform: translate(-50%, calc(-50% + 7px));
            transition: opacity 1.2s ease, transform 1.2s ease;
            pointer-events: none;
        }

        #message.visible {
            opacity: 1;
            transform: translate(-50%, -50%);
        }

        #message.typing::after {
            display: inline-block;
            width: 1px;
            height: 1em;
            margin-left: 4px;
            background: rgba(255, 255, 255, .8);
            content: "";
            vertical-align: -0.12em;
            animation: cursor-blink 850ms steps(2, start) infinite;
        }

        @keyframes appear {
            from { opacity: 0; }
            to { opacity: var(--brightness); }
        }

        @keyframes twinkle {
            from { filter: brightness(.7); }
            to { filter: brightness(1.35); }
        }

        @keyframes drift {
            from { translate: 0 0; }
            to { translate: var(--drift-x) var(--drift-y); }
        }

        @keyframes pulse {
            from { filter: brightness(.82); }
            to { filter: brightness(1.3); }
        }

        @keyframes shoot {
            0% { opacity: 0; translate: 0 0; }
            8% { opacity: 1; }
            75% { opacity: .9; }
            100% { opacity: 0; translate: var(--travel-x) var(--travel-y); }
        }

        @keyframes cursor-blink {
            to { visibility: hidden; }
        }

        @media (max-width: 480px) {
            #question-box {
                width: min(360px, calc(100% - 34px - env(safe-area-inset-left) - env(safe-area-inset-right)));
                padding: 34px 22px 28px;
                border-radius: 16px;
            }

            #question-box h1 {
                margin-bottom: 23px;
                font-size: 29px;
            }

            .answers {
                gap: 9px;
            }

            .answer-button {
                min-width: 0;
                flex: 1;
                padding: 11px 12px;
                font-size: 15px;
            }

            #message {
                width: calc(100% - 38px - env(safe-area-inset-left) - env(safe-area-inset-right));
                font-size: clamp(22px, 7vw, 29px);
                line-height: 1.5;
            }
        }

        @media (max-width: 480px) and (max-height: 500px) {
            #question-box {
                padding: 22px 20px 20px;
            }

            #question-box h1 {
                margin-bottom: 16px;
                font-size: 26px;
            }

            .answer-button {
                min-height: 42px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
            }

            .star,
            .shooting-star,
            #message.typing::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <!-- Stars and shooting stars are added here after either answer is chosen. -->
    <div id="sky" aria-hidden="true"></div>
    <!-- The two answers share the same transition into the night-sky scene. -->
    <main id="question-box" aria-labelledby="question">
        <h1 id="question">Do you love me?</h1>
        <div class="answers">
            <button class="answer-button" type="button">Yes</button>
            <button class="answer-button" type="button">Absolutely</button>
        </div>
    </main>
    <p id="message" aria-live="polite" aria-atomic="true"></p>

    <script>
        const sky = document.querySelector("#sky");
        const questionBox = document.querySelector("#question-box");
        const answerButtons = document.querySelectorAll(".answer-button");
        const message = document.querySelector("#message");
        const sentence = "And I love you more than any star in the universe";
        let started = false;

        function getStarCount() {
            const area = window.innerWidth * window.innerHeight;
            const mobile = window.matchMedia("(max-width: 600px)").matches;
            const density = mobile ? 0.00055 : 0.00085;
            const maximum = mobile ? 520 : 1050;
            return Math.min(maximum, Math.max(240, Math.round(area * density)));
        }

        function createStars() {
            const fragment = document.createDocumentFragment();
            const count = getStarCount();

            for (let index = 0; index < count; index += 1) {
                const star = document.createElement("span");
                const sizeRoll = Math.random();
                const isBright = index < 5;
                const size = isBright ? Math.random() * .9 + 2.8
                    : sizeRoll < 0.78 ? Math.random() * 1.1 + 0.35
                    : sizeRoll < 0.97 ? Math.random() * 1.3 + 1.1
                    : Math.random() * 1.5 + 2;
                const brightness = (Math.random() * 0.5 + 0.28).toFixed(2);
                const delay = (Math.random() * 2.7).toFixed(2);

                star.className = isBright ? "star bright" : size > 2 ? "star large" : "star";
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty("--size", `${size.toFixed(1)}px`);
                star.style.setProperty("--brightness", brightness);
                star.style.setProperty("--glow", `${(size * 2.2).toFixed(1)}px`);
                star.style.setProperty("--delay", `${delay}s`);
                star.style.setProperty("--twinkle-duration", `${(2 + Math.random() * 5).toFixed(1)}s`);
                star.style.setProperty("--drift-duration", `${(7 + Math.random() * 11).toFixed(1)}s`);
                star.style.setProperty("--drift-x", `${(Math.random() * 8 - 4).toFixed(1)}px`);
                star.style.setProperty("--drift-y", `${(Math.random() * 8 - 4).toFixed(1)}px`);
                fragment.appendChild(star);
            }

            sky.appendChild(fragment);
            return 3400;
        }

        // Shooting stars travel down and across the sky, then remove themselves.
        function createShootingStar() {
            const shootingStar = document.createElement("span");
            const speed = 650 + Math.random() * 650;
            const travel = 180 + Math.random() * 300;
            const angle = 20 + Math.random() * 25;

            shootingStar.className = "shooting-star";
            shootingStar.style.left = `${Math.random() * 90}%`;
            shootingStar.style.top = `${Math.random() * 55}%`;
            shootingStar.style.setProperty("--length", `${45 + Math.random() * 65}px`);
            shootingStar.style.setProperty("--angle", `${angle}deg`);
            shootingStar.style.setProperty("--speed", `${speed}ms`);
            shootingStar.style.setProperty("--travel-x", `${travel}px`);
            shootingStar.style.setProperty("--travel-y", `${travel * 0.55}px`);
            sky.appendChild(shootingStar);
            window.setTimeout(() => shootingStar.remove(), speed + 100);
        }

        function typeMessage() {
            message.classList.add("visible", "typing");
            let index = 0;

            function typeNextCharacter() {
                message.textContent = sentence.slice(0, index + 1);
                index += 1;

                if (index < sentence.length) {
                    const pause = 48 + Math.random() * 48 + (sentence[index - 1] === " " ? 35 : 0);
                    window.setTimeout(typeNextCharacter, pause);
                } else {
                    message.classList.remove("typing");
                }
            }

            typeNextCharacter();
        }

        // Disable both answers immediately so the transition can only start once.
        function beginExperience() {
            if (started) return;
            started = true;
            answerButtons.forEach((button) => {
                button.disabled = true;
            });
            questionBox.classList.add("leaving");
            window.setTimeout(() => questionBox.remove(), 900);

            const skyRevealTime = createStars();
            window.setTimeout(() => {
                createShootingStar();
                typeMessage();
            }, skyRevealTime + 1750);

            // Use changing pauses so shooting stars feel occasional, not rhythmic.
            function scheduleNextShootingStar() {
                const pause = 2200 + Math.random() * 4300;
                window.setTimeout(() => {
                    createShootingStar();
                    scheduleNextShootingStar();
                }, pause);
            }
            window.setTimeout(scheduleNextShootingStar, skyRevealTime);
        }

        answerButtons.forEach((button) => button.addEventListener("click", beginExperience));
    </script>
</body>
</html>
